name: Actualizar Dashboard SPSKY

on:
  push:
    paths:
      - 'data/**.xlsx'   # Se dispara cuando se sube un xlsx a /data
  workflow_dispatch:      # También permite correrlo manualmente

permissions:
  contents: write        # Necesario para hacer commit del index.html generado

concurrency:
  group: "deploy"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install pandas openpyxl numpy

      - name: Ejecutar parser
        run: python parser.py

      - name: Verificar que se generó el HTML
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html no fue generado"
            exit 1
          fi
          echo "Dashboard generado: $(wc -c < index.html) bytes"

      - name: Commit del index.html generado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "Sin cambios" || git commit -m "Dashboard actualizado $(date +'%Y-%m-%d %H:%M UTC')"
          git push
