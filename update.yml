name: Actualizar Dashboard FDS

on:
  push:
    paths:
      - 'data/**.xlsx'   # Se dispara solo cuando se sube un xlsx a /data
  workflow_dispatch:      # También permite correrlo manualmente desde GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pandas openpyxl numpy

      - name: Ejecutar parser
        run: python parser.py

      - name: Verificar que se generó el HTML
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html no fue generado"
            exit 1
          fi
          echo "Dashboard generado correctamente ($(wc -c < index.html) bytes)"

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
